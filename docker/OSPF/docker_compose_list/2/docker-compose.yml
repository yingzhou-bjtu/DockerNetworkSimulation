version: "2.3"
services:
  r1:
    container_name: r1
    image: ospf
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: /bin/bash -c "tail -f /dev/null"
    command: ["./myapp"]
    networks:
      r1r2:
          ipv4_address: 10.0.1.2
      r1r3:
          ipv4_address: 10.0.9.2
      r1r4:
          ipv4_address: 10.0.4.3 
    restart: on-failure
    
  r2:
    container_name: r2
    image: ospf
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: /bin/bash -c "tail -f /dev/null"
    command: ["./myapp"]
    networks:
      r1r2:
          ipv4_address: 10.0.1.3 
      r2r3:
          ipv4_address: 10.0.2.2 
    restart: on-failure
    
  r3:
    container_name: r3
    image: ospf
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: /bin/bash -c "tail -f /dev/null"
    command: ["./myapp"]
    networks:
      r1r3:
          ipv4_address: 10.0.9.3
      r2r3:
          ipv4_address: 10.0.2.3
      r3r4:
          ipv4_address: 10.0.3.2
    restart: on-failure
    
  r4:
    container_name: r4
    image: ospf
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: /bin/bash -c "tail -f /dev/null"
    command: ["./myapp"]
    networks:
      r3r4:
          ipv4_address: 10.0.3.3 
      r1r4:
          ipv4_address: 10.0.4.2
    restart: on-failure
          
networks:
  
  r1r2:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.1.0/24
      
  r1r3:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.9.0/24
      
  r2r3:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.2.0/24
      
  r3r4:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.3.0/24
      
  r1r4:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.4.0/24
